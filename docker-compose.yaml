include: [./external/franka_ros2/docker-compose.yml]
services:
  franka_teleop:
    extends:
      service: base
    image: "franka_teleop:latest"
    volumes:
      - ./handcv/:/ros2_ws/src/handcv/
      - ./hand_interfaces/:/ros2_ws/src/hand_interfaces/
      - ./franka_teleop/:/ros2_ws/src/franka_teleop/
      - ./franka_teleop_bringup/:/ros2_ws/src/franka_teleop_bringup/
      - ./cv_franka_bridge/:/ros2_ws/src/cv_franka_bridge/
    command:  >
      bash -c "
      source /opt/ros/jazzy/setup.bash &&
      colcon build &&
      source install/setup.bash &&
      ros2 launch franka_teleop_bringup bringup.launch.py
      "

  franka_ros2:
    build:
      args:
        - USER_UID=1001
        - USER_GID=1001
    image: "franka_ros2:latest"
    init: true
    network_mode: host
    entrypoint: ""
    command: >
      bash -c "source /opt/ros/jazzy/setup.bash && source install/setup.bash && ros2 launch franka_fr3_moveit_config moveit.launch.py robot_ip:=dont-care use_fake_hardware:=true"

  rviz:
    extends:
      service: base
    image: "rviz:latest"
    command: ros2 run rviz2 rviz2

  realsense:
    extends:
      service: base
    image: "realsense:latest"
    device_cgroup_rules:
      - 'c 81:* rmw'
      - 'c 189:* rmw'
    command: ros2 launch realsense2_camera rs_launch.py pointcloud.enable:=true
  
  base:
    build: 
      context: .
      dockerfile: Dockerfile
      args:
        - USER_UID=1001
        - USER_GID=1001
        - USERNAME=${USERNAME}
    network_mode: host
    privileged: true
    tty: true
    stdin_open: true
    environment:
      QT_X11_NO_MITSHM: 1
      DISPLAY: ${DISPLAY}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev/shm:/dev/shm
      - /dev:/dev
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: ros2 run demo_nodes_cpp talker
