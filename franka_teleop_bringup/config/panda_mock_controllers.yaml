/**:
  controller_manager:
    ros__parameters:
      update_rate: 1000  # Hz

      panda_arm_controller:
        type: joint_trajectory_controller/JointTrajectoryController
        # type: joint_group_position_controller/JointGroupPositionController

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster


  fr3_servo_controller:
    ros__parameters:
      arm_id: "fr3"
      allow_nonzero_velocity_at_trajectory_end: true
      command_interfaces:
        - position
      state_interfaces:
        - position
        - velocity
      joints:
        - fr3_joint1
        - fr3_joint2
        - fr3_joint3
        - fr3_joint4
        - fr3_joint5
        - fr3_joint6
        - fr3_joint7
        # - panda_joint1
        # - panda_joint2
        # - panda_joint3
        # - panda_joint4
        # - panda_joint5
        # - panda_joint6
        # - panda_joint7
